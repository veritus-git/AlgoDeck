<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AlgoDeck ⚡ Koło MAP</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app-container">

    <!-- =========================================================================
         WIDOK 1: TYLKO POWIADOMIENIE (DOKŁADNIE JAK NA SCREENSHOCIE 3)
         Wyświetlany WYŁĄCZNIE gdy pobrano PDF — BEZ ŻADNYCH INNYCH ELEMENTÓW!
         ========================================================================= -->
    <div id="view-detected" class="view-detected hidden">
      <div class="detected-box-card">
        <div class="det-top-row">
          <div class="det-title-group">
            <span class="det-bolt">⚡</span>
            <span class="det-title-text" id="det-box-title">Wykryto zadanie PDF — 1 Kliknięcie</span>
          </div>
          <button type="button" id="btn-det-close" class="det-btn-close" title="Zamknij">✕</button>
        </div>
        <div class="det-meta-row">
          Plik: <strong id="det-filename-text">zadanie.pdf</strong> &bull; Zadanie: <strong id="det-code-text">ZAD</strong>
        </div>
        <button type="button" id="btn-det-oneclick" class="btn-det-oneclick">
          <span class="btn-bolt">⚡</span> Utwórz Workspace i Otwórz VS Code (1 Klik)
        </button>
      </div>
    </div>


    <!-- =========================================================================
         WIDOK 2: STANDARDOWY START - ZIELONY OKRĄGŁY PRZYCISK "URUCHOM"
         Pokazuje się po kliknięciu ikony rozszerzenia w przeglądarce!
         ========================================================================= -->
    <div id="view-launcher" class="view-launcher is-offline">
      <!-- Kompaktowy nagłówek -->
      <header class="launcher-header">
        <div class="brand-compact">
          <span class="logo-badge-mini">⚡</span>
          <span class="brand-title-mini">AlgoDeck</span>
        </div>
        <div id="daemon-status" class="status-pill status-offline">
          <span class="status-dot"></span>
          <span id="status-text">OFFLINE</span>
        </div>
      </header>

      <!-- Centrum: Duży, podświetlany zielony okrągły przycisk "URUCHOM" -->
      <div class="launcher-center">
        <div class="launch-button-wrapper">
          <button type="button" id="btn-round-launch" class="btn-round-launch" title="Uruchom środowisko AlgoDeck">
            <div class="launch-circle-glow"></div>
            <div class="launch-circle-inner">
              <span class="launch-play-icon">▶</span>
              <span class="launch-title">URUCHOM</span>
            </div>
          </button>
        </div>

        <div id="launch-hint" class="launch-hint">
          Kliknij, aby aktywować Stream Deck i środowisko
        </div>

        <!-- Pasek aktywnego zadania (jeśli program już działa) -->
        <div id="launcher-active-bar" class="launcher-active-bar hidden">
          <span class="active-pulse-dot"></span>
          <span class="active-label">Aktywne:</span>
          <strong id="launcher-active-name">ALGO_IDLE</strong>
        </div>
      </div>

      <!-- Szybkie akcje po uruchomieniu -->
      <div class="launcher-actions-row">
        <button type="button" id="btn-quick-settings" class="btn-action-pill" title="Otwórz panel ustawień w Rust">
          <span>⚙️ Ustawienia</span>
        </button>
        <button type="button" id="btn-quick-idle" class="btn-action-pill" title="Pokaż ekran zachęty na Stream Decku">
          <span>🏠 Ekran Zachęty</span>
        </button>
        <button type="button" id="btn-toggle-workspace" class="btn-action-pill" title="Zarządzaj zadaniami w workspace">
          <span>📋 Zadania ▾</span>
        </button>
      </div>

      <!-- Rozwijany panel pełnego workspace (opcjonalny dla zaawansowanych) -->
      <div id="workspace-drawer" class="workspace-drawer hidden">
        <nav class="nav-tabs">
          <button class="tab-btn active" data-tab="tab-import">Import (PDF/ZIP)</button>
          <button class="tab-btn" data-tab="tab-manual">Ręczny</button>
          <button class="tab-btn" data-tab="tab-gallery">Lista zadań</button>
        </nav>

        <main class="tab-content-wrapper">
          <!-- ZAKŁADKA 1: IMPORT -->
          <section id="tab-import" class="tab-pane active">
            <div class="staging-zones-grid">
              <div class="stage-zone-wrapper">
                <div class="zone-label">📄 PDF zadania</div>
                <div class="stage-dropzone" id="drop-pdf">
                  <div class="drop-body">
                    <span class="drop-mini-icon">📄</span>
                    <span class="drop-mini-text">Upuść plik <strong>.pdf</strong></span>
                  </div>
                  <button type="button" class="btn-picker" id="btn-browse-pdf">Wybierz</button>
                  <input type="file" id="file-input-pdf" accept=".pdf" class="hidden">
                </div>
                <div class="stage-card hidden" id="staged-pdf-card">
                  <span class="card-file-icon">📄</span>
                  <div class="card-file-info">
                    <div class="card-file-name" id="staged-pdf-name">zadanie.pdf</div>
                  </div>
                  <button type="button" class="btn-card-remove" id="btn-remove-pdf">✕</button>
                </div>
              </div>

              <div class="stage-zone-wrapper">
                <div class="zone-label">📦 Testy ZIP</div>
                <div class="stage-dropzone" id="drop-zip">
                  <div class="drop-body">
                    <span class="drop-mini-icon">📦</span>
                    <span class="drop-mini-text">Upuść <strong>.zip</strong></span>
                  </div>
                  <button type="button" class="btn-picker" id="btn-browse-zip">Wybierz</button>
                  <input type="file" id="file-input-zip" accept=".zip" class="hidden">
                </div>
                <div class="stage-card hidden" id="staged-zip-card">
                  <span class="card-file-icon">📦</span>
                  <div class="card-file-info">
                    <div class="card-file-name" id="staged-zip-name">testy.zip</div>
                  </div>
                  <button type="button" class="btn-card-remove" id="btn-remove-zip">✕</button>
                </div>
              </div>
            </div>

            <button type="button" id="btn-start-staged" class="btn-primary w-full hidden" style="margin-top: 10px;">
              <span>⚡ Rozpocznij import</span>
            </button>
          </section>

          <!-- ZAKŁADKA 2: RĘCZNY -->
          <section id="tab-manual" class="tab-pane">
            <div class="card-form">
              <div class="form-group">
                <label for="man-code" class="required">Kod zadania:</label>
                <input type="text" id="man-code" placeholder="np. chw, kol" required spellcheck="false">
              </div>
              <div class="form-group">
                <label for="man-title">Pełny tytuł:</label>
                <input type="text" id="man-title" placeholder="np. Koleje" spellcheck="false">
              </div>
              <button type="button" id="btn-create-manual" class="btn-primary w-full" style="margin-top: 8px;">
                <span>Utwórz i otwórz VS Code</span>
              </button>
            </div>
          </section>

          <!-- ZAKŁADKA 3: GALERIA -->
          <section id="tab-gallery" class="tab-pane">
            <div class="gallery-controls">
              <input type="text" id="gallery-search" placeholder="Filtruj zadania..." spellcheck="false">
              <button id="btn-refresh-gallery" class="btn-secondary">Odśwież</button>
            </div>
            <div id="gallery-list" class="gallery-list">
              <div class="loading-state">Ładowanie zadań...</div>
            </div>
          </section>
        </main>
      </div>
    </div>

    <!-- Kontener powiadomień Toast -->
    <div id="toast-container" class="toast-container"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
