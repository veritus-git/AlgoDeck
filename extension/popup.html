<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AlgoDeck ⚡ Koło MAP</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app-container">
    <!-- Górny Pasek Nagłówka -->
    <header class="app-header">
      <div class="header-left">
        <div class="logo-badge">⚡</div>
        <div class="brand">
          <h1>AlgoDeck</h1>
          <span class="sub-badge">KOŁO MAP</span>
        </div>
      </div>
      <div class="header-right">
        <div id="daemon-status" class="status-pill status-offline" title="Status połączenia z daemonem AlgoDeck">
          <span class="status-dot"></span>
          <span id="status-text">OFFLINE</span>
        </div>
      </div>
    </header>

    <!-- Pasek Aktywnego Zadania -->
    <div id="active-task-bar" class="active-task-bar hidden">
      <div class="active-task-info">
        <span class="pulse-indicator"></span>
        <span class="active-label">Aktywne:</span>
        <strong id="active-task-name">---</strong>
      </div>
      <button id="btn-quick-vscode" class="btn-quick-vscode" title="Otwórz w VS Code">
        VS Code
      </button>
    </div>

    <!-- Zakładki Nawigacji (Bez zbędnych emotek) -->
    <nav class="nav-tabs">
      <button class="tab-btn active" data-tab="tab-import">
        <span>Import (PDF + ZIP)</span>
      </button>
      <button class="tab-btn" data-tab="tab-manual">
        <span>Ręczny Workspace</span>
      </button>
      <button class="tab-btn" data-tab="tab-gallery">
        <span>Zadania</span>
      </button>
    </nav>

    <!-- Zawartość Zakładek -->
    <main class="tab-content-wrapper">
      
      <!-- ZAKŁADKA 1: IMPORT (DWA OSOBNE OBSZARY + PERSISTANCE) -->
      <section id="tab-import" class="tab-pane active">
        <div class="staging-zones-grid">
          
          <!-- Obszar 1: Treść Zadania (PDF) -->
          <div class="stage-zone-wrapper">
            <div class="zone-label">📄 Treść zadania (PDF)</div>
            
            <!-- Stan pusty (Dropzone) -->
            <div class="stage-dropzone" id="drop-pdf">
              <div class="drop-body">
                <span class="drop-mini-icon">📄</span>
                <span class="drop-mini-text">Upuść plik <strong>.pdf</strong></span>
              </div>
              <button type="button" class="btn-picker" id="btn-browse-pdf">Wybierz</button>
              <input type="file" id="file-input-pdf" accept=".pdf" class="hidden">
            </div>

            <!-- Stan wczytany (Staged) -->
            <div class="stage-card hidden" id="staged-pdf-card">
              <span class="card-file-icon">📄</span>
              <div class="card-file-info">
                <div class="card-file-name" id="staged-pdf-name">zadanie.pdf</div>
                <div class="card-file-meta" id="staged-pdf-meta">Wczytano treść</div>
              </div>
              <button type="button" class="btn-card-remove" id="btn-remove-pdf" title="Usuń plik PDF">✕</button>
            </div>
          </div>

          <!-- Obszar 2: Paczka Testów (ZIP) -->
          <div class="stage-zone-wrapper">
            <div class="zone-label">📦 Paczka testów (ZIP)</div>
            
            <!-- Stan pusty (Dropzone) -->
            <div class="stage-dropzone" id="drop-zip">
              <div class="drop-body">
                <span class="drop-mini-icon">📦</span>
                <span class="drop-mini-text">Upuść archiwum <strong>.zip</strong></span>
              </div>
              <button type="button" class="btn-picker" id="btn-browse-zip">Wybierz</button>
              <input type="file" id="file-input-zip" accept=".zip" class="hidden">
            </div>

            <!-- Stan wczytany (Staged) -->
            <div class="stage-card hidden" id="staged-zip-card">
              <span class="card-file-icon">📦</span>
              <div class="card-file-info">
                <div class="card-file-name" id="staged-zip-name">testy.zip</div>
                <div class="card-file-meta" id="staged-zip-meta">Wczytano testy</div>
              </div>
              <button type="button" class="btn-card-remove" id="btn-remove-zip" title="Usuń plik ZIP">✕</button>
            </div>
          </div>

        </div>

        <!-- Formularz weryfikacji metadanych zadania -->
        <div id="import-details" class="card-form hidden">
          <div class="form-row">
            <div class="form-group flex-1">
              <label for="imp-code">Kod:</label>
              <input type="text" id="imp-code" placeholder="np. chw" spellcheck="false">
            </div>
            <div class="form-group flex-2">
              <label for="imp-title">Tytuł zadania:</label>
              <input type="text" id="imp-title" placeholder="np. Chwasty" spellcheck="false">
            </div>
          </div>

          <div class="form-row">
            <div class="form-group flex-1">
              <label for="imp-time">Czas (s):</label>
              <input type="number" id="imp-time" value="1.0" step="0.1" min="0.1">
            </div>
            <div class="form-group flex-1">
              <label for="imp-mem">RAM (MB):</label>
              <input type="number" id="imp-mem" value="128" step="1" min="16">
            </div>
          </div>

          <div id="tests-summary-badge" class="tests-summary-badge">
            <span class="badge-dot">●</span>
            <span id="tests-count-text">0 testów wykrytych</span>
          </div>
        </div>

        <!-- Przycisk Rozpoczęcia Backendowego -->
        <button type="button" id="btn-start-staged" class="btn-primary w-full hidden">
          <span>⚡ Rozpocznij</span>
        </button>
      </section>

      <!-- ZAKŁADKA 2: RĘCZNY WORKSPACE (BEZ TIPÓW) -->
      <section id="tab-manual" class="tab-pane">
        <div class="card-form">
          <div class="form-group">
            <label for="man-code" class="required">Nazwa / Kod zadania:</label>
            <input type="text" id="man-code" placeholder="np. chw, kol, suma, zad1" required spellcheck="false">
          </div>

          <div class="form-group">
            <label for="man-title">Pełny tytuł (opcjonalny):</label>
            <input type="text" id="man-title" placeholder="np. Koleje" spellcheck="false">
          </div>

          <div class="form-row">
            <div class="form-group flex-1">
              <label for="man-time">Limit czasu (s):</label>
              <input type="number" id="man-time" value="1.0" step="0.1" min="0.1">
            </div>
            <div class="form-group flex-1">
              <label for="man-mem">Limit pamięci (MB):</label>
              <input type="number" id="man-mem" value="128" step="1" min="16">
            </div>
          </div>

          <!-- Opcjonalny przykładowy test -->
          <div class="collapsible-section">
            <div class="section-title">
              <span>Przykładowy test (opcjonalny)</span>
            </div>
            <div class="form-group">
              <label for="man-input">Dane wejściowe (cin):</label>
              <textarea id="man-input" rows="2" placeholder="Wklej wejście testu..." spellcheck="false"></textarea>
            </div>
            <div class="form-group">
              <label for="man-output">Oczekiwany wynik (cout):</label>
              <textarea id="man-output" rows="2" placeholder="Wklej oczekiwany wynik..." spellcheck="false"></textarea>
            </div>
          </div>

          <button type="button" id="btn-create-manual" class="btn-primary w-full">
            <span>Utwórz Workspace i Otwórz VS Code</span>
          </button>
        </div>
      </section>

      <!-- ZAKŁADKA 3: GALERIA / ZADANIA (Z USUWANIEM) -->
      <section id="tab-gallery" class="tab-pane">
        <div class="gallery-controls">
          <input type="text" id="gallery-search" placeholder="Filtruj zadania..." spellcheck="false">
          <button id="btn-refresh-gallery" class="btn-secondary" title="Odśwież listę">Odśwież</button>
        </div>

        <div id="gallery-list" class="gallery-list">
          <div class="loading-state">Ładowanie zadań...</div>
        </div>
      </section>

    </main>

    <!-- Kontener powiadomień Toast -->
    <div id="toast-container" class="toast-container"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
