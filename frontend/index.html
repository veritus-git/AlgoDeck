<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AlgoDeck - Minimalistyczne Środowisko do Algorytmiki</title>
  <meta name="description" content="Proste, szybkie przygotowanie zadań algorytmicznych ze wsparciem Stream Decka.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    
    <!-- Prosty nagłówek -->
    <header class="navbar">
      <div class="brand-logo">
        <span class="logo-icon">⚡</span>
        <span class="logo-name">Algo<span class="accent-text">Deck</span></span>
      </div>
      <div class="nav-status-group">
        <span id="active-task-pill" class="status-pill hidden">Zadanie: <strong id="active-task-name">---</strong></span>
        <button id="btn-back-main" class="btn btn-action" title="Przełącz Stream Deck na Main">🔙 Stream Deck: Main</button>
      </div>
    </header>

    <main class="main-content">
      
      <!-- Strefa upuszczania PDF -->
      <section class="upload-section card glass">
        <div class="dropzone" id="pdf-dropzone">
          <input type="file" id="pdf-file-input" accept="application/pdf" hidden>
          <div class="drop-icon">📄</div>
          <h2>Upuść plik PDF z zadaniem</h2>
          <p class="dropzone-subtitle">lub kliknij poniżej, aby wybrać plik</p>
          <div class="dropzone-actions">
            <button id="btn-browse-file" class="btn btn-primary">Wybierz plik PDF</button>
            <button id="btn-demo-task" class="btn btn-secondary">Załaduj zadanie demo (Koleje)</button>
          </div>
        </div>

        <div id="engine-info" class="engine-info hidden">
          ℹ️ Silnik analizy: <strong id="engine-name">Lokalny parser</strong>
        </div>
      </section>

      <!-- Panel aktywnego zadania (Gdy załadowano) -->
      <section id="dashboard-section" class="dashboard-section hidden">
        <div class="card glass task-card">
          <div class="task-header-row">
            <div>
              <span id="problem-id-tag" class="tag tag-cyan">kol</span>
              <h1 id="problem-title" class="problem-heading">Koleje</h1>
            </div>
            
            <!-- 4 GŁÓWNE PRZYCISKI - PROSTO I NA TEMAT -->
            <div class="primary-controls">
              <button id="btn-test-all" class="btn btn-big-green">
                🚀 TESTUJ WSZYSTKO (1 PRZYCISK)
              </button>
              <button id="btn-run" class="btn btn-action">
                ▶️ Kompiluj i odpal
              </button>
              <button id="btn-kill" class="btn btn-danger">
                🛑 STOP (KILL)
              </button>
              <button id="btn-vscode" class="btn btn-action">
                💻 VS Code
              </button>
            </div>
          </div>
        </div>

        <!-- Symulator Stream Decka (5 kluczowych przycisków) -->
        <div class="card glass deck-preview-card">
          <div class="deck-preview-title">🎮 Stream Deck (Profil zadania)</div>
          <div class="deck-row-simple">
            <button class="deck-key key-green" onclick="pressStreamDeckKey(0)">
              <span class="k-icon">🚀</span>
              <span class="k-lbl">TESTUJ</span>
              <span class="k-sub" id="deck-status-test">ALL</span>
            </button>
            <button class="deck-key key-blue" onclick="pressStreamDeckKey(1)">
              <span class="k-icon">▶️</span>
              <span class="k-lbl">ODPAL</span>
              <span class="k-sub">RUN</span>
            </button>
            <button class="deck-key key-red" onclick="pressStreamDeckKey(2)">
              <span class="k-icon">🛑</span>
              <span class="k-lbl">KILL</span>
              <span class="k-sub">STOP</span>
            </button>
            <button class="deck-key key-purple" onclick="pressStreamDeckKey(3)">
              <span class="k-icon">💻</span>
              <span class="k-lbl">VS CODE</span>
              <span class="k-sub">OPEN</span>
            </button>
            <button class="deck-key key-gray" onclick="pressStreamDeckKey(4)">
              <span class="k-icon">🔙</span>
              <span class="k-lbl">POWRÓT</span>
              <span class="k-sub">MAIN</span>
            </button>
          </div>
        </div>

        <!-- Wyniki testów i konsola -->
        <div class="card glass results-card">
          <div class="results-header">
            <h3>Wyniki Testów</h3>
            <span id="test-summary-badge" class="tag tag-amber">Nieuruchomione</span>
          </div>
          <div id="tests-list" class="tests-list">
            <!-- Testy wstrzykiwane dynamicznie -->
          </div>

          <div class="console-box">
            <div class="console-title">Log wykonania / Diff:</div>
            <pre id="console-output">Gotowy. Naciśnij 'TESTUJ WSZYSTKO' lub użyj przycisku na Stream Decku.</pre>
          </div>
        </div>
      </section>

    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
