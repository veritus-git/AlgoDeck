                    <path d="M -3,14 Q 0,21 0,21 Q 0,21 3,14 Z" fill="#fef08a"/>
                </g>
            
  <!-- Bottom Text Label -->
  <text x="72" y="122" font-family="'DejaVu Sans', 'Ubuntu', 'Inter', sans-serif" font-weight="bold" font-size="16" fill="#ffffff" text-anchor="middle" letter-spacing="0.75">TESTUJ</text>
</svg>