name: Build and Release AlgoDeck Rust GUI

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }} (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: algodeck-gui
            artifact_name: algodeck-gui-linux-x86_64

          # macOS Apple Silicon (arm64)
          - os: macos-14
            target: aarch64-apple-darwin
            binary_name: algodeck-gui
            artifact_name: algodeck-gui-macos-arm64

          # macOS Intel (x86_64) - cross-compiled on macos-14 Apple Silicon
          - os: macos-14
            target: x86_64-apple-darwin
            binary_name: algodeck-gui
            artifact_name: algodeck-gui-macos-x86_64

          # Windows x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: algodeck-gui.exe
            artifact_name: algodeck-gui-windows-x86_64.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxinerama-dev libasound2-dev libudev-dev pkg-config

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Rust GUI
        working-directory: gui
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare Artifact
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp gui/target/${{ matrix.target }}/release/algodeck-gui.exe dist/${{ matrix.artifact_name }}
          else
            cp gui/target/${{ matrix.target }}/release/algodeck-gui dist/${{ matrix.artifact_name }}
            chmod +x dist/${{ matrix.artifact_name }}
          fi

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}
          retention-days: 7

  release:
    name: Publish Release with Precompiled Binaries
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Verify artifacts
        run: ls -la dist/

      - name: Compute Release Tag
        id: release_tag
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "name=AlgoDeck ${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            TAG_NAME="v2.0.${{ github.run_number }}"
            echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT
            echo "name=AlgoDeck $TAG_NAME" >> $GITHUB_OUTPUT
          fi

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.release_tag.outputs.name }}
          body: |
            Natywne binarki panelu AlgoDeck Rust GUI (`algodeck-gui`) skompilowane dla wszystkich platform:
            - **Linux x86_64:** `algodeck-gui-linux-x86_64`
            - **macOS Apple Silicon:** `algodeck-gui-macos-arm64`
            - **macOS Intel:** `algodeck-gui-macos-x86_64`
            - **Windows x86_64:** `algodeck-gui-windows-x86_64.exe`
            
            Wersja: `${{ steps.release_tag.outputs.tag }}`
            Commit: `${{ github.sha }}`
          draft: false
          prerelease: false
          make_latest: true
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
