name: Build and Release AlgoDeck Standalone Binary

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }} (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: algodeck
            artifact_name: algodeck-linux-x86_64

          # macOS Apple Silicon (arm64)
          - os: macos-14
            target: aarch64-apple-darwin
            binary_name: algodeck
            artifact_name: algodeck-macos-arm64

          # macOS Intel (x86_64)
          - os: macos-14
            target: x86_64-apple-darwin
            binary_name: algodeck
            artifact_name: algodeck-macos-x86_64

          # Windows x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: algodeck.exe
            artifact_name: algodeck-windows-x86_64.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxinerama-dev libasound2-dev libudev-dev libhidapi-dev pkg-config

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Rust Standalone Binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare Artifact
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp target/${{ matrix.target }}/release/algodeck.exe dist/${{ matrix.artifact_name }}
          else
            cp target/${{ matrix.target }}/release/algodeck dist/${{ matrix.artifact_name }}
            chmod +x dist/${{ matrix.artifact_name }}
            if [ "${{ runner.os }}" = "macOS" ]; then
              codesign --force --deep -s - dist/${{ matrix.artifact_name }} || true
            fi
          fi

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}
          retention-days: 7

  release:
    name: Publish Release with Precompiled Binaries
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Package Release Bundles
        run: |
          # 1. Ogólna paczka assetów
          zip -r dist/algodeck-assets.zip frontend extension

          # 2. Samodzielna paczka dla Linux x86_64
          mkdir -p dist/pkg-linux
          cp dist/algodeck-linux-x86_64 dist/pkg-linux/algodeck
          cp bootstrap.sh dist/pkg-linux/install.sh
          chmod +x dist/pkg-linux/algodeck dist/pkg-linux/install.sh
          cp -r frontend extension dist/pkg-linux/
          tar -czf dist/algodeck-linux-x86_64.tar.gz -C dist/pkg-linux .
          rm -rf dist/pkg-linux

          # 3. Samodzielna paczka dla macOS Apple Silicon (arm64)
          mkdir -p dist/pkg-macos-arm64
          cp dist/algodeck-macos-arm64 dist/pkg-macos-arm64/algodeck
          cp install_mac.sh dist/pkg-macos-arm64/install.sh
          chmod +x dist/pkg-macos-arm64/algodeck dist/pkg-macos-arm64/install.sh
          cp -r frontend extension dist/pkg-macos-arm64/
          tar -czf dist/algodeck-macos-arm64.tar.gz -C dist/pkg-macos-arm64 .
          rm -rf dist/pkg-macos-arm64

          # 4. Samodzielna paczka dla macOS Intel (x86_64)
          mkdir -p dist/pkg-macos-x86_64
          cp dist/algodeck-macos-x86_64 dist/pkg-macos-x86_64/algodeck
          cp install_mac.sh dist/pkg-macos-x86_64/install.sh
          chmod +x dist/pkg-macos-x86_64/algodeck dist/pkg-macos-x86_64/install.sh
          cp -r frontend extension dist/pkg-macos-x86_64/
          tar -czf dist/algodeck-macos-x86_64.tar.gz -C dist/pkg-macos-x86_64 .
          rm -rf dist/pkg-macos-x86_64

          # 5. Samodzielna paczka dla Windows x86_64
          mkdir -p dist/pkg-win
          cp dist/algodeck-windows-x86_64.exe dist/pkg-win/algodeck.exe
          cp install_win.ps1 install.bat dist/pkg-win/
          cp -r frontend extension dist/pkg-win/
          (cd dist/pkg-win && zip -r ../algodeck-windows-x86_64.zip .)
          rm -rf dist/pkg-win

      - name: Verify artifacts
        run: ls -la dist/

      - name: Compute Release Tag
        id: release_tag
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "name=AlgoDeck ${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            TAG_NAME="v2.0.${{ github.run_number }}"
            echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT
            echo "name=AlgoDeck $TAG_NAME" >> $GITHUB_OUTPUT
          fi

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.release_tag.outputs.name }}
          body: |
            ### ⚡ AlgoDeck v2.0.0 — 100% Rust Olympic Programming Engine & Stream Deck Controller

            Natywne pakiety instalacyjne i binarki dla wszystkich platform:
            - **Linux x86_64 (Samodzielna paczka z instalatorem):** `algodeck-linux-x86_64.tar.gz`
            - **macOS Apple Silicon (Samodzielna paczka z instalatorem):** `algodeck-macos-arm64.tar.gz`
            - **macOS Intel (Samodzielna paczka z instalatorem):** `algodeck-macos-x86_64.tar.gz`
            - **Windows x86_64 (Samodzielna paczka z instalatorem):** `algodeck-windows-x86_64.zip`
            
            Pojedyncze binarki:
            - `algodeck-linux-x86_64`
            - `algodeck-macos-arm64`
            - `algodeck-macos-x86_64`
            - `algodeck-windows-x86_64.exe`
            
            Wersja: `${{ steps.release_tag.outputs.tag }}`
            Commit: `${{ github.sha }}`
          draft: false
          prerelease: false
          make_latest: true
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
