[package]
name = "algodeck-gui"
version = "2.0.0"
edition = "2021"
authors = ["AlgoDeck Team"]
description = "AlgoDeck Settings and Control Panel in Rust"

[dependencies]
eframe = { version = "0.29", default-features = true }
egui = "0.29"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = { version = "2.10", features = ["json"] }
rfd = "0.14"
dirs = "5.0"
open = "5.3"
ksni = { version = "0.3", features = ["blocking"] }
